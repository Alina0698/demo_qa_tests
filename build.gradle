plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // Selenide подтянет свои зависимости, но нам нужны явные версии JUnit
    testImplementation "com.codeborne:selenide:7.7.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"

    // ЭТО КЛЮЧЕВОЕ: явное добавление лаунчера для Gradle 9+
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    testRuntimeOnly "org.slf4j:slf4j-simple:1.7.29"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
